# Second LiveKit for Stremio in calls (docs/self-hosting.md "Stremio in calls"). It runs natively on the host next to the
# stremio-bot; voice stays on the first LiveKit. Start it with the keys in the environment, never in this file:
#   LIVEKIT_KEYS="<key>: <secret>" livekit-server --config deploy/media-livekit.yaml
# (the same key and secret go to VOKKO_MEDIA_LIVEKIT_API_KEY / _API_SECRET).
#
# Machine-specific values (the rtc interface and address below): copy this file to deploy/media-livekit.local.yaml (gitignored),
# set them there and point livekit-server (or its launchd job, deploy/launchd/README.md) at the local copy instead.
#
# Signalling listens on loopback only; a tunnel (cloudflared) publishes it as the public host in VOKKO_MEDIA_LIVEKIT_URL, e.g.
# wss://live.vokko.example.com. Media goes to the viewers directly. Behind CGNAT nothing here needs a port forward: viewers reach
# the host through addresses their own STUN lookup and ours discover (when the provider NAT maps endpoint-independently). There
# is no TURN, so a viewer behind a symmetric NAT may not connect.
port: 7880
bind_addresses:
  - 127.0.0.1
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  stun_servers:
    - stun.cloudflare.com:3478
    - stun.l.google.com:19302
  # Optional: offer only the wired LAN interface and address. A host with Wi-Fi on the same subnet, Tailscale, container bridges
  # or an IPv6 address that does not route can offer candidates that break connections; pin yours in the local copy, e.g.:
  # interfaces:
  #   includes:
  #     - en0
  # ips:
  #   includes:
  #     - 192.0.2.10/32
turn:
  enabled: false
logging:
  level: info
