[package]
name = "vokko-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# The workspace lints, except unsafe code is "deny" here (not "forbid") so the one WebView2 call in window.rs can opt in.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
vokko-engine.workspace = true
vokko-protocol.workspace = true
vokko-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = ["Foundation", "Media_Control"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSImage", "NSImageView", "NSView", "NSControl", "NSResponder"] }
