[package]
name = "vokko-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The workspace lints, except unsafe code is "deny" here (not "forbid") so the one WebView2 call in window.rs can opt in.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
vokko-engine.workspace = true
vokko-protocol.workspace = true
vokko-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
base64.workspace = true
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = ["Foundation", "Media_Control", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Encodes an extracted icon (the version `image` and tauri already use).
png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSImage", "NSImageView", "NSView", "NSControl", "NSResponder"] }

# Native LiveKit voice (src/native_voice): WebKitGTK has no WebRTC. webrtc-sys downloads a prebuilt libwebrtc; cpal's
# pure-Rust PulseAudio client also talks to PipeWire (pipewire-pulse), and its ALSA backend needs libasound2-dev to build.
[target.'cfg(target_os = "linux")'.dependencies]
livekit = { version = "0.9.5", features = ["rustls-tls-webpki-roots"] }
cpal = { version = "0.18.2", features = ["pulseaudio"] }
tokio.workspace = true
futures-util.workspace = true
linuxvideo = "0.3.5"
zune-jpeg = "0.4"
# MPRIS players for the Spotify status (src/spotify.rs): the zbus that tauri's notification and single-instance plugins already build.
zbus = "5"
