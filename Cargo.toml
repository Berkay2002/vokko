[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri", "apps/cli", "xtask"]
default-members = ["crates/*", "apps/cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
vokko-protocol = { path = "crates/protocol" }
vokko-engine = { path = "crates/engine" }
vokko-platform = { path = "crates/platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
