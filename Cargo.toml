[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri", "apps/cli", "tools/*", "xtask"]
default-members = ["crates/*", "apps/cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
vokko-protocol = { path = "crates/protocol" }
vokko-engine = { path = "crates/engine" }
vokko-platform = { path = "crates/platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws", "multipart", "matched-path"] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "time", "tls-rustls-ring-webpki"] }
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
