name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vokko
          POSTGRES_PASSWORD: vokko
          POSTGRES_DB: vokko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vokko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://vokko:vokko@127.0.0.1:5432/vokko_test
      DATABASE_URL: postgres://vokko:vokko@127.0.0.1:5432/vokko_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy -p vokko-server -p vokko-protocol -p vokko-engine -p vokko-platform -p vokko-cli --all-targets -- -D warnings
      - name: test
        run: cargo test -p vokko-server -p vokko-protocol -p vokko-engine -p vokko-platform -p vokko-cli
      - name: layers
        run: cargo xtask layers
      # Skips itself when the secret is unset (forks, pull requests from forks).
      - name: privacy
        run: cargo xtask privacy
        env:
          VOKKO_PRIVACY_DENYLIST: ${{ secrets.VOKKO_PRIVACY_DENYLIST }}

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build
        working-directory: apps/desktop
        run: npm run build
      - name: test
        working-directory: apps/desktop
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install chromium
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium
      # Runs against the in-memory mock (VITE_VOKKO_API unset); the playwright config starts the dev server itself.
      - name: e2e
        working-directory: apps/desktop
        run: npm run e2e
      - name: upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  tauri:
    # Optional: the desktop shell needs webkit2gtk; failures here do not block the PR.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: webkit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev pkg-config libssl-dev
      - run: npm ci
      # tauri.conf.json's frontendDist is checked at build time, so build the UI first.
      - name: build ui
        working-directory: apps/desktop
        run: npm run build
      - uses: Swatinem/rust-cache@v2
      - name: build tauri crate
        run: cargo build -p vokko-desktop
