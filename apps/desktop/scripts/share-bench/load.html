<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VokkoLoad</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; width: 100%; height: 100%; }
      #tick { position: fixed; left: 0; top: 0; width: 160px; height: 160px; background: #000; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="tick"></div>
    <script>
      // A stand-in for a game: a full-window raymarched fragment shader (?iter= sets its GPU cost), uncapped when the
      // browser runs with --disable-gpu-vsync --disable-frame-rate-limit. window.__load.take() returns the frame times
      // since the last call. ?tick=1 flashes the top-left square white for 100 ms once a second and, on the same frame,
      // plays a 100 ms 1 kHz beep (the share's audio/video sync check).
      const q = new URLSearchParams(location.search);
      const iter = Number(q.get("iter") ?? "400");
      const canvas = document.getElementById("c");
      const gl = canvas.getContext("webgl2", { antialias: false, powerPreference: "high-performance" });
      const vs = "#version 300 es\nin vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }";
      const fs = `#version 300 es
        precision highp float; uniform vec2 r; uniform float t; out vec4 o;
        float map(vec3 p){ vec3 q = mod(p, 2.) - 1.; return length(q) - .35 + .1 * sin(p.x * 3. + t) * sin(p.y * 3.) * sin(p.z * 3. + t); }
        void main(){
          vec2 uv = (gl_FragCoord.xy * 2. - r) / r.y;
          vec3 ro = vec3(sin(t * .3) * 2., cos(t * .2), t), rd = normalize(vec3(uv, 1.5)), col = vec3(0.);
          float d = 0.;
          for (int i = 0; i < ${iter}; i++) { float h = map(ro + rd * d); d += h * .5; col += .012 * vec3(.5 + .5 * sin(d), .4, .7 + .3 * cos(d * .7)) / (1. + h * 40.); }
          o = vec4(col, 1.);
        }`;
      const prog = gl.createProgram();
      for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        gl.attachShader(prog, s);
      }
      gl.linkProgram(prog);
      gl.useProgram(prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      const rLoc = gl.getUniformLocation(prog, "r");
      const tLoc = gl.getUniformLocation(prog, "t");
      const dbg = gl.getExtension("WEBGL_debug_renderer_info");
      const renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "unknown";

      const tick = q.get("tick") === "1";
      const tickEl = document.getElementById("tick");
      let audio = null;
      let lastSecond = -1;
      const beep = () => {
        audio ??= new AudioContext();
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        gain.gain.value = 0.25;
        osc.frequency.value = 1000;
        osc.connect(gain).connect(audio.destination);
        osc.start();
        osc.stop(audio.currentTime + 0.1);
      };

      let frames = [];
      let prev = performance.now();
      function frame(now) {
        frames.push(now - prev);
        prev = now;
        const w = innerWidth * devicePixelRatio, h = innerHeight * devicePixelRatio;
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
        gl.uniform2f(rLoc, w, h);
        gl.uniform1f(tLoc, now / 1000);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        if (tick) {
          const second = Math.floor(now / 1000);
          if (second !== lastSecond) { lastSecond = second; beep(); }
          tickEl.style.background = now % 1000 < 100 ? "#fff" : "#000";
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
      window.__load = {
        renderer,
        take() { const out = frames; frames = []; return out; },
      };
    </script>
  </body>
</html>
