[package]
name = "vokko-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "vokko_server"
path = "src/lib.rs"

[[bin]]
name = "vokko-server"
path = "src/main.rs"

[dependencies]
vokko-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
sqlx.workspace = true
argon2.workspace = true
rand.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
tokio-util.workspace = true
reqwest = { workspace = true, features = ["stream", "json"] }
rustls.workspace = true
oauth2 = { version = "5", default-features = false }
openidconnect = { version = "4", default-features = false }
http = "1"
# PNG only: decodes and re-encodes app icons (the version already in the lock via the desktop app).
image = { version = "0.25", default-features = false, features = ["png"] }
sha1 = "0.10"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1-rustls-tls"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
unicode-segmentation = "1"

[dev-dependencies]
rsa = { version = "0.9", features = ["pem"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
